name: Verify examples on SQL Server 2025

# Kitaptaki tüm T-SQL örneklerini her push'ta gerçek bir SQL Server 2025 üzerinde
# çalıştırır. Bir örnek (ör. yeni bir CU davranış değiştirdiğinde) bozulursa build kırmızıya döner.

on:
  push:
    branches: [main]
    paths: ['examples/**', '.github/workflows/verify-examples.yml']
  pull_request:
    branches: [main]
    paths: ['examples/**']
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SQL Server 2025 container'ı başlat
        run: |
          docker run -e "ACCEPT_EULA=Y" -e "MSSQL_SA_PASSWORD=CI@Sql2025Passw0rd" \
            -e "MSSQL_PID=Developer" -p 1433:1433 --name sql -d \
            mcr.microsoft.com/mssql/server:2025-latest

      - name: Hazır olmasını bekle
        run: |
          for i in $(seq 1 40); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -P 'CI@Sql2025Passw0rd' -C -No -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server hazır (${i}. deneme)"
              docker exec sql /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P 'CI@Sql2025Passw0rd' -C -No -h -1 -W -Q "SELECT @@VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "SQL Server zamanında hazır olmadı"; docker logs sql; exit 1

      - name: Örnekleri çalıştır (hata = fail)
        run: |
          docker cp examples/00-lab-setup-and-examples.sql sql:/tmp/ex.sql
          OUT=$(docker exec sql /opt/mssql-tools18/bin/sqlcmd \
                  -S localhost -U sa -P 'CI@Sql2025Passw0rd' -C -No -W -i /tmp/ex.sql 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -qiE "Msg [0-9]+|Incorrect syntax|Invalid (object|column)"; then
            echo "::error::Örneklerde T-SQL hatası bulundu"
            exit 1
          fi
          echo "Tüm örnekler hatasız çalıştı."
